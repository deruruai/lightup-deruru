<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0614">
<title>LIGHT UP, DERURU!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0614; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; position: relative; z-index: 1; }
  /* 유튜브 MV (캔버스 뒤에 깔림) */
  #mv { position: fixed; inset: 0; overflow: hidden; display: none; z-index: 0; pointer-events: none; transition: opacity .5s; }
  #mvbox { position: absolute; }
  #mvbox iframe { width: 100%; height: 100%; border: 0; }
  /* 갤러리 크게 보기 (길게 눌러 저장할 수 있도록 진짜 <img> 로 띄운다) */
  #viewer { position: fixed; inset: 0; background: rgba(6, 3, 14, .94); display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; z-index: 10; font-family: 'Noto Sans KR', sans-serif; }
  #viewer.on { display: flex; }
  #viewer img { max-width: 92vw; max-height: 78vh; border-radius: 14px; box-shadow: 0 0 40px rgba(255, 80, 200, .45);
                -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; touch-action: auto; }
  #viewer .row { display: flex; gap: 10px; }
  #viewer a, #viewer button { font: 700 15px 'Noto Sans KR', sans-serif; color: #fff; text-decoration: none; border: 0; cursor: pointer;
                              padding: 11px 22px; border-radius: 999px; background: linear-gradient(90deg, #ff3daa, #b45aff); }
  #viewer button { background: rgba(255, 255, 255, .14); }
  #viewer p { color: #cfc6e6; font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div id="mv"><div id="mvbox"><div id="ytplayer"></div></div></div>
<div id="viewer">
  <img id="viewerImg" alt="보상 일러스트">
  <p>휴대폰에서는 그림을 길게 눌러 사진에 저장할 수 있어요</p>
  <div class="row"><a id="viewerSave" download>저장하기</a><button id="viewerClose">닫기</button></div>
</div>

<!-- p5.js (폴더 안에 들어 있어서 인터넷 없이도 실행됨) -->
<script src="lib/p5.min.js"></script>
<!-- 데이터 : JSON 대신 JS 파일이라 index.html 더블클릭으로도 읽힌다 -->
<script src="data/songs.js"></script>
<script src="data/charts.js"></script>
<!-- 게임 코드 -->
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/mv.js"></script>
<script src="js/scene_title.js"></script>
<script src="js/scene_select.js"></script>
<script src="js/scene_play.js"></script>
<script src="js/scene_result.js"></script>
<script src="js/scene_gallery.js"></script>
<script src="js/scene_mvsync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
